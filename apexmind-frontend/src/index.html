<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="APEXMIND Inmobiliaria: casas campestres, apartamentos y fincas en Silvania, Fusagasugá, Melgar, Anapoima y La Mesa.">
  <meta name="theme-color" content="#111418">
  <title>APEXMIND · Inmobiliaria</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Librerías (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

  <!-- Estilos propios: de lo general a lo específico -->
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/base/global.css">
  <link rel="stylesheet" href="css/layout/navbar.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/components/property-card.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/auth.css">
  <link rel="stylesheet" href="css/views/dashboard.css">

  <!-- Se carga UNA sola vez. 'defer' + type="module" mantienen el orden: primero Bootstrap, luego la app. -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="visually-hidden-focusable position-absolute p-2 bg-white" href="#app">Saltar al contenido</a>

  <nav class="navbar navbar-expand-lg site-navbar sticky-top py-3" data-bs-theme="dark" aria-label="Principal">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#/">
        <i class="bi bi-house-door-fill text-gold fs-3" aria-hidden="true"></i>
        <span class="brand lh-1">
          <span class="brand__title">APEXMIND</span>
          <span class="brand__subtitle">INMOBILIARIA</span>
        </span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
              aria-controls="main-nav" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item"><a class="nav-link-custom" href="#/" data-route="/">Inicio</a></li>
          <li class="nav-item"><a class="nav-link-custom" href="#/catalog" data-route="/catalog">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link-custom" href="#/favorites" data-route="/favorites"><i class="bi bi-heart me-1 text-danger" aria-hidden="true"></i>Mis favoritos</a></li>
          <li class="nav-item" id="nav-admin-item" hidden><a class="nav-link-custom text-gold fw-semibold" href="#/dashboard" data-route="/dashboard"><i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>Panel agente</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2" id="nav-auth"></div>
      </div>
    </div>
  </nav>

  <!-- Las vistas se montan aquí; solo existe UNA a la vez (antes eran 5 <section> ocultas con ids duplicados). -->
  <main id="app" tabindex="-1">
    <noscript><p class="container py-5">Esta página necesita JavaScript para funcionar.</p></noscript>
  </main>

  <!-- Contenedores globales reutilizables -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" aria-live="polite"></div>

  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="confirm-modal-title" data-slot="title"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body" data-slot="message"></div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-danger" data-slot="confirm"></button></div>
      </div>
    </div>
  </div>
</body>
</html>
